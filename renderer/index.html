<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Cline 上游</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="pulse" id="pulse"></span>Cline 上游</div>
      <div class="bar-actions">
        <span class="status" id="status">读取中…</span>
        <button class="ghost" id="refresh" type="button">刷新</button>
        <button class="primary" id="save" type="button" disabled>保存</button>
      </div>
    </header>

    <section class="controls">
      <label class="switch" title="在请求体里写入 provider.only（实测网关忽略，仅作探测）">
        <input type="checkbox" id="inject" /><span>写入 routing（实验）</span>
      </label>
      <label class="switch" title="同时写入 allow_fallbacks: false，失败即报错而不换家">
        <input type="checkbox" id="hardPin" /><span>强制不降级</span>
      </label>
      <label class="switch" title="实际落点不在所选上游内时弹出提示">
        <input type="checkbox" id="toast" /><span>不符时提示</span>
      </label>
      <span class="dirty" id="dirty">有未保存的修改</span>
    </section>

    <p class="hint" id="hint"></p>

    <section class="block">
      <div class="block-head">
        <span class="label">目标上游（实验：网关当前忽略）</span>
        <span class="sub">勾选后保存 · 数字是 实际/钉住/备选 次数 · 全不勾 = 只观察</span>
      </div>
      <div class="models" id="upstreams"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <span class="label">启用哪些模型</span>
        <span class="sub" id="models-hint"></span>
      </div>
      <div class="models" id="models"></div>
    </section>

    <main>
      <table>
        <thead>
          <tr>
            <th class="col-time">时间</th>
            <th class="col-model">模型</th>
            <th>实际落点</th>
            <th>钉住</th>
            <th class="num">备选</th>
            <th class="num">缓存命中</th>
            <th class="num">成本</th>
            <th>校验</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7" class="empty">还没有请求记录。</td></tr>
        </tbody>
      </table>
    </main>

    <footer class="foot">
      <span id="foot-left">—</span>
      <span id="foot-right"></span>
    </footer>

    <script src="panel.js"></script>
  </body>
</html>
