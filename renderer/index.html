<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Cline 上游</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="pulse" id="pulse"></span>Cline 上游</div>
      <div class="bar-actions">
        <span class="status" id="status">读取中…</span>
        <button class="ghost" id="refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="controls">
      <label class="field grow">
        <span class="label">锚定到哪个上游</span>
        <select id="target"></select>
      </label>
      <label class="switch" title="在请求体里写入 provider.only">
        <input type="checkbox" id="inject" /><span>写入 routing 字段</span>
      </label>
      <label class="switch" title="同时写入 allow_fallbacks: false">
        <input type="checkbox" id="hardPin" /><span>强制不降级</span>
      </label>
      <label class="switch" title="实际落点与目标不一致时弹出提示">
        <input type="checkbox" id="toast" /><span>不符时提示</span>
      </label>
    </section>

    <p class="hint" id="hint"></p>

    <section class="block">
      <div class="block-head">
        <span class="label">检测到的上游</span>
        <span class="sub">实际 / 钉住 / 备选 次数 · 点标签即设为锚定目标</span>
      </div>
      <div class="chips" id="upstreams"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <span class="label">启用哪些模型</span>
        <span class="sub" id="models-hint"></span>
      </div>
      <div class="models" id="models"></div>
    </section>

    <main>
      <table>
        <thead>
          <tr>
            <th class="col-model">模型</th>
            <th>实际落点</th>
            <th>钉住</th>
            <th class="num">备选</th>
            <th class="num">缓存命中</th>
            <th class="num">成本</th>
            <th>校验</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7" class="empty">还没有请求记录。</td></tr>
        </tbody>
      </table>
    </main>

    <footer class="foot">
      <span id="foot-left">—</span>
      <span id="foot-right"></span>
    </footer>

    <script src="panel.js"></script>
  </body>
</html>
